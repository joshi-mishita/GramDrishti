name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which halves of the monorepo exist yet. Jobs for a missing half are
  # skipped, and GitHub treats a skipped job as passing for required checks.
  detect:
    name: Detect projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/requirements.txt ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "No backend/pyproject.toml or backend/requirements.txt: backend job skipped."
          fi
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json: frontend job skipped."
          fi

  backend:
    name: Backend (ruff, pytest)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            pip install -r requirements.txt
          fi
          pip install ruff pytest
      - name: Generate mock oracle (git-ignored answer key)
        run: |
          OUT="$RUNNER_TEMP/mock" python ../data/generate_mock_data.py > /dev/null
          cp -r "$RUNNER_TEMP/mock/synthetic_oracle" ../data/
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (lint, test, build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: API types match contract/openapi.json
        run: npm run check:types
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Contract drift (Backend Guide B1, S14): the committed openapi.json must equal what the app
  # exports, the frontend types must equal what openapi-typescript generates from it, and every
  # example in contract/examples must validate against its Pydantic model.
  contract:
    name: Contract (openapi, types, examples)
    needs: detect
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: openapi.json matches the app
        working-directory: backend
        run: |
          python -m gramdrishti.export_openapi
          git diff --exit-code -- ../contract/openapi.json || {
            echo "::error file=contract/openapi.json::Out of date. Run: cd backend && python -m gramdrishti.export_openapi"; exit 1; }
      - name: Every example validates against its model
        working-directory: backend
        run: pytest -q tests/test_contract.py -k "example_validates or index_lists or every_path or lon_lat or openapi"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend types match openapi.json
        working-directory: frontend
        run: |
          npm ci
          npm run gen:types
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error file=frontend/src/api/schema.d.ts::Out of date. Run: cd frontend && npm run gen:types"; exit 1; }

  # The whole product from this checkout with Docker, then the demo script in Playwright
  # (scripts/e2e_docker.sh). The runner has no trained model, so the stack trains its own
  # version, which has no verification record: the verification steps check the "not computed"
  # state instead of numbers (docs/DECISIONS.md D122).
  docker:
    name: Docker stack and demo e2e
    needs: detect
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build, prepare, start, e2e, API-down check
        run: ./scripts/e2e_docker.sh
      - name: Screens and Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-docker
          path: |
            docs/screens/s14-*.png
            frontend/test-results/e2e-docker/
          if-no-files-found: ignore
