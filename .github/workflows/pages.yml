# Public read-only demo on GitHub Pages (S18, docs/deploy.md).
#
# Builds the snapshot variant of the app (VITE_SNAPSHOT=1): every GET response is exported once from the
# backend, so the site needs no server and works offline after the first visit. Reviews cannot be saved
# there (the app says so). Pull requests only build; pushes to main build and deploy.
#
# One-time setup by the repository owner: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "backend/**"
      - "frontend/**"
      - "contract/**"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the read-only demo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATA_MODE: mock
      # A throwaway review database: only the approvals below are in it.
      GRAMDRISHTI_DB: /tmp/gramdrishti-pages.sqlite
    steps:
      - uses: actions/checkout@v4

      # Python 3.13 and requirements.lock: the versions of the verification record
      # (backend/gramdrishti/verify/records/), so its numbers can be shown without opening TEST again.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install the backend
        run: |
          pip install -r backend/requirements.lock
          pip install --no-deps -e backend

      # The verified model, when the owner has attached it to the release tagged "model-bundle"
      # (scripts/pack_model_bundle.sh). A Linux retrain gets another model version with no verification
      # record (D122), so without it the verification and impact screens say "not computed".
      - name: Fetch the verified model bundle, if released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/model-bundle
          if gh release download model-bundle --repo "$GITHUB_REPOSITORY" --pattern 'gramdrishti-model-*.tar.gz' --dir /tmp/model-bundle; then
            tar -xzf /tmp/model-bundle/gramdrishti-model-*.tar.gz -C /tmp/model-bundle
            echo "SEED_MODEL=--seed-model-from /tmp/model-bundle" >> "$GITHUB_ENV"
            echo "Using the released model: $(ls /tmp/model-bundle/*.tar.gz)"
          else
            echo "::notice::No release 'model-bundle' with a model file: training in the runner."
          fi

      - name: Prepare (oracle, model, snapshots, verification record, farmers)
        working-directory: backend
        run: python -m gramdrishti.pipeline.prepare_demo $SEED_MODEL
      - name: Say whether the verification record was copied
        run: |
          if [ ! -f backend/artifacts/verification.json ]; then
            echo "::warning::No verification record for this model: the site's verification and impact screens will say 'not computed'."
          fi

      # Like the demo procedure (D172): a few named advisories are approved so the farmer screens have
      # advice. The reviewer name says no officer reviewed them (D177).
      - name: Approve the demo advisories
        working-directory: backend
        run: python -m gramdrishti.pipeline.approve_demo --issue-date 2024-09-09 --panchayat MP0307 MP0311 --crop bajra
      - name: Export every response for snapshot mode
        working-directory: backend
        run: python -m gramdrishti.export_snapshot --out ../contract/snapshot

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the app for /<repository>/
        working-directory: frontend
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SNAPSHOT: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
          # GitHub Pages answers unknown paths with 404.html: the app's own router then shows the page.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          du -sh dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
