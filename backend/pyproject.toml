[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gramdrishti"
version = "0.1.0"
description = "Panchayat-level downscaling of block weather forecasts for agro-advisories (SIH26074)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "simpleeval>=0.9.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    # Only needed so data/generate_mock_data.py writes the GeoJSON files in the reproduction test.
    "shapely>=2.0",
]

[tool.setuptools.packages.find]
include = ["gramdrishti*"]

[tool.setuptools.package-data]
gramdrishti = ["contract/demo_dates.json"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["gramdrishti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "oracle: needs data/synthetic_oracle/ (regenerate with `python data/generate_mock_data.py`)",
]
